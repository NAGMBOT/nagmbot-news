<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>NAGMBOT — الخبر</title><style>@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap');:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--dim:#8b949e;--accent:#58a6ff}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Arabic',sans-serif;line-height:1.9;padding:20px}.container{max-width:700px;margin:0 auto}.header{text-align:center;padding:30px 0 20px;border-bottom:1px solid var(--border);margin-bottom:30px}.logo{font-size:1.8em;font-weight:700;color:var(--accent)}.ticker{display:inline-block;background:rgba(88,166,255,.15);color:var(--accent);padding:4px 14px;border-radius:20px;font-weight:600;margin:10px 0}.date{color:var(--dim);font-size:.85em;margin-top:8px}.article{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:20px}.article h1{font-size:1.3em;font-weight:600;margin-bottom:16px;line-height:1.6}.article p{margin-bottom:14px;color:var(--text)}.footer{text-align:center;padding:20px 0;color:var(--dim);font-size:.8em;border-top:1px solid var(--border);margin-top:30px}</style></head><body><div class="container"><div class="header"><div class="logo">NAGMBOT</div><div class="ticker" id="tk"></div><div class="date" id="dt"></div></div><div class="article"><h1 id="hd">جارٍ التحميل…</h1><div id="bd"></div></div><div class="footer">NAGMBOT — أخبار الأسهم الأمريكية مترجمة</div></div><script>(function(){var id=(location.hash||'').replace('#','');if(!/^[a-z0-9][a-z0-9-]{3,63}$/i.test(id)){document.getElementById('hd').textContent='رابط غير صالح';return;}fetch('https://raw.githubusercontent.com/NAGMBOT/nagmbot-news/articles/articles/'+id+'.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(a){document.title=a.h+' — NAGMBOT';document.getElementById('tk').textContent=a.t;try{document.getElementById('dt').textContent=new Date(a.d).toLocaleString('ar-SA');}catch(e){}document.getElementById('hd').textContent=a.h;var bd=document.getElementById('bd');String(a.b).split(String.fromCharCode(10)).forEach(function(p){p=p.trim();if(!p)return;var el=document.createElement('p');el.textContent=p;bd.appendChild(el);});}).catch(function(){document.getElementById('hd').textContent='تعذر تحميل الخبر';});})();</script></body></html>
